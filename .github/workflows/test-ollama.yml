name: Test Ollama

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test-ollama:
    name: Test Ollama Engine
    runs-on: [self-hosted, ollama]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Make scripts executable
        run: chmod +x *.sh lh

## Assuming authentication is handled by the self-hosted runner        
#      - name: Check Ollama status
#        run: ./lh login ollama
      
#      - name: List Ollama models
#        run: ./lh list ollama
      
      - name: Run Ollama tests
        run: cd test && bash tests.sh ollama
