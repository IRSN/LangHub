name: Test OpenSCAD Generation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test-openscad-godiva:
    name: Test Godiva OpenSCAD with ${{ matrix.engine }}
    runs-on: [self-hosted, ${{ matrix.engine }}]
    strategy:
      matrix:
        engine: [ollama, claude, copilot]
      fail-fast: false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Make scripts executable
        run: chmod +x *.sh lh test/*.sh
      
      - name: Check ${{ matrix.engine }} status
        run: ./lh login ${{ matrix.engine }}
      
      - name: List ${{ matrix.engine }} models
        run: ./lh list ${{ matrix.engine }}
      
      - name: Ensure Ollama model (if ollama)
        if: matrix.engine == 'ollama'
        run: |
          if ! ollama list | grep -q qwen2.5-coder:7b; then
            echo "Pulling qwen2.5-coder:7b model..."
            ollama pull qwen2.5-coder:7b
          fi
      
      - name: Run Godiva OpenSCAD generation test
        run: cd test && bash godiva-openscad-${{ matrix.engine }}.sh
      
      - name: Upload generated OpenSCAD artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openscad-godiva-${{ matrix.engine }}
          path: |
            test/godiva-openscad-${{ matrix.engine }}.md
            test/output/godiva-${{ matrix.engine }}.log
          retention-days: 30
